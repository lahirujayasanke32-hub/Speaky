<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeakUp – Presentation Coach</title>
<style>
:root{--bg:#efe9df;--card:#fffaf2;--tx:#2b2622;--mu:#74695c;--pr:#1d4e5f;--on:#fff;--ac:#c4572f;--oa:#fff;--g:#1d4e5f;--ok:#2f7d4f;--wa:#b8431f;--bd:#dccfbd;--l1:#1d4e5f;--l2:#c4572f;--l3:#8a6d1d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--card:#1d2329;--tx:#ece7df;--mu:#9aa3a8;--bd:#2c353c;--pr:#6fb7c9;--on:#0a1a20;--ac:#e0764f;--oa:#1c0b04;--g:#24404a;--ok:#58b07c;--wa:#e8825a;--l1:#6fb7c9;--l2:#e08a66;--l3:#d4b25a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Noto Sans Sinhala",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:80px}
main{max-width:560px;margin:auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;overflow:hidden}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--pr);color:var(--on);font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
button:disabled{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:9px 2px 10px;font-size:12px;font-weight:600;border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--pr);border-top-color:var(--pr)}
.lesson{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--bd);margin-bottom:8px;background:var(--card);cursor:pointer}
.lesson.lock{opacity:.45;cursor:default}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pr);color:var(--on);font-weight:700;flex:none}
.dot.done{background:var(--ok)}.dot.lock{background:var(--mu)}
label{display:block}
.pw{-webkit-text-security:disc;text-security:disc}
.tf{display:block;width:100%;height:46px;min-height:0;resize:none;overflow:hidden;white-space:nowrap;line-height:1.3}
textarea,select,input[type=text],input[type=password],input:not([type]){width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:120px}
video{width:100%;border-radius:14px;background:#000;max-height:48vh;margin-bottom:8px}
.rec{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:10px auto}
.rec.live{background:#e03131;animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.08)}}
.big{font-size:44px;font-weight:800;text-align:center}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--pr)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.chip{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--bd);font-size:13px;margin:2px}
mark{background:#ffd43b66;color:inherit;border-radius:4px}
ul{padding-left:20px;margin:6px 0}
.stat{text-align:center;min-width:90px}.stat b{font-size:22px;display:block}
.th{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.th img{height:70px;border-radius:8px}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1.1;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:20}
#fab{background:var(--ac);color:var(--oa)}
.ico{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.mark{width:68px;height:68px;border-radius:18px;background:var(--pr);color:var(--on);display:grid;place-items:center;margin:0 auto 14px}
#fab small{font-size:17px;font-weight:800}
main{padding:16px}body.in main{padding-top:68px}
#bar{position:fixed;top:0;left:0;right:0;z-index:30;display:none;align-items:center;gap:12px;height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;background:var(--g);color:#fff}
#bar button{background:transparent;padding:10px 8px;border-radius:10px;display:flex;flex-direction:column;gap:5px}#bar button i{display:block;width:22px;height:2.5px;background:#fff;border-radius:2px}#bar b{font-size:18px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
#drawer{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:310px;background:var(--card);z-index:50;transform:translateX(-102%);transition:transform .22s;padding:0 0 env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;overflow-y:auto}
#drawer.open{transform:none;box-shadow:4px 0 20px rgba(0,0,0,.3)}
.dh{background:var(--g);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 20px}
.av{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:24px;font-weight:700;margin-bottom:8px}
.mi{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;color:var(--tx);border-radius:0;padding:15px 18px;font-weight:600}
.mi.on{background:var(--bd);color:var(--pr)}
.auth{padding-top:6vh}
</style></head><body>
<header id="bar"><button id="mb" onclick="openMenu()" aria-label="Menu"><i></i><i></i><i></i></button><b>SpeakUp</b></header><div id="scrim" onclick="menu=false;draw()"></div><aside id="drawer"></aside><main id="app"></main><button id="fab" onclick="nav('practice')" aria-label="Quick practice with AI"><small>AI</small></button><nav id="nav"></nav>
<script>
const LV=[
{n:"Level 1 · Foundations",c:"var(--l1)",ls:[
{id:"1a",t:"Introduce yourself",tip:"Breathe, slow down, look at the camera.",task:"Introduce yourself in 30–60 seconds: name, what you do, one interesting fact.",min:20},
{id:"1b",t:"Cut the filler words",tip:"Replace “um” and “like” with a silent pause.",task:"Describe your favorite place for 45 seconds without filler words.",min:25},
{id:"1c",t:"Pace and volume",tip:"Pause after key points. Emphasize important words.",task:"Explain how to make a cup of tea, with deliberate pauses (about 45 seconds).",min:25},
{id:"1d",t:"Eye contact",tip:"Look at the camera lens, not at the screen.",task:"Talk about your day for 45 seconds, looking at the camera lens as much as you can.",min:30},
{id:"1e",t:"Warm and friendly tone",tip:"A small smile makes your voice sound warmer.",task:"Welcome an audience to an event in about 30 seconds, sounding warm and friendly.",min:30},
{id:"1f",t:"Confident posture",tip:"Sit or stand tall, shoulders relaxed, hands visible.",task:"Introduce a friend or someone you admire in 45 seconds with open posture and relaxed hands.",min:30},
{id:"1g",t:"Speak with energy",tip:"Vary your pitch on key words to avoid a flat voice.",task:"Describe your favorite movie, game or hobby for 45 seconds with real energy in your voice.",min:35},
{id:"1h",t:"One clear message",tip:"Pick one main idea and repeat it once at the end.",task:"Explain one idea you care about in 1 minute, ending with a one-sentence takeaway.",min:35}]},
{n:"Level 2 · Structure & Delivery",c:"var(--l2)",ls:[
{id:"2a",t:"Strong opening",tip:"Open with a question, a story or a surprising fact.",task:"Give a 1–2 minute talk on a topic you love. Start with a strong hook.",min:50},
{id:"2b",t:"Tell a story",tip:"Situation → problem → turning point → lesson.",task:"Tell a 2-minute story about a challenge you overcame and what you learned.",min:60},
{id:"2c",t:"Intro, body, conclusion",tip:"Tell them what you will say, say it, then recap.",task:"Give a 2-minute talk with 3 clear points on why people should learn a new skill.",min:70},
{id:"2d",t:"Use examples",tip:"Every point needs an example or a number.",task:"Give a 2-minute talk on why exercise matters, backing each point with an example.",min:65},
{id:"2e",t:"Smooth transitions",tip:"Signal your moves: first, next, finally.",task:"Explain how to prepare for an exam in 2 minutes, using clear transitions between steps.",min:65},
{id:"2f",t:"Strong closing",tip:"End with a summary and a clear call to action.",task:"Give a 2-minute talk on any subject and finish with a memorable closing line.",min:70},
{id:"2g",t:"Explain it simply",tip:"Avoid jargon. Explain as if to a 12-year-old.",task:"Explain something technical you know (an app, a machine, a school subject) in simple words, for 2 minutes.",min:70},
{id:"2h",t:"Gestures and stance",tip:"Use open hand gestures at natural moments. Avoid fidgeting.",task:"Give a 2-minute talk about a place you would recommend, using natural hand gestures and a steady stance.",min:70}]},
{n:"Level 3 · Mastery",c:"var(--l3)",ls:[
{id:"3a",t:"Persuade",tip:"Claim, evidence, emotional appeal, call to action.",task:"Persuade your audience to adopt one good habit, with evidence and a call to action (2–3 minutes).",min:80},
{id:"3b",t:"Pitch your idea",tip:"Problem, solution, market, ask.",task:"Pitch a product or business idea to investors in 3 minutes.",min:80},
{id:"3c",t:"Full presentation",tip:"Combine everything: hook, structure, evidence, close.",task:"Deliver a full 4–5 minute presentation on any topic, as if on stage.",min:85},
{id:"3d",t:"Handle tough questions",tip:"Pause, restate the question, answer, then stop.",task:"Imagine a skeptic asks, “Why should I trust your idea?” Answer in about 90 seconds.",min:80},
{id:"3e",t:"Tell me about yourself",tip:"Past, present, future in under 2 minutes.",task:"Answer “Tell me about yourself” as if in a job interview, in about 2 minutes.",min:80},
{id:"3f",t:"Inspire a crowd",tip:"Speak slowly, use pauses, paint a vivid picture.",task:"Give an inspiring 3-minute speech to a large audience about a goal worth chasing.",min:85},
{id:"3g",t:"Present the data",tip:"State the insight first, then the evidence.",task:"Present three numbers or facts about any topic (3 minutes) and explain what they mean.",min:85},
{id:"3h",t:"Master class",tip:"Own the stage: strong voice, eye contact, steady gestures.",task:"Deliver a polished 5-minute talk on a topic of your choice, combining everything you have learned.",min:90}]}];
const ALL=LV.flatMap(l=>l.ls);
const FILL=["um","uh","uhh","umm","like","you know","basically","actually","literally","i mean","kind of","sort of"];
const DEF={xp:0,streak:0,last:"",done:{},hist:[],name:"",ai:"en",sl:"en-US",photo:"",goal:""};
let S=Object.assign({},DEF),USER=null,menu=false,AUTH={m:"in",n:"",u:"",p:"",p2:"",e:"",b:false,k:false};
const save=()=>{try{if(USER)localStorage.setItem("su_d_"+USER,JSON.stringify(S))}catch(e){}};
function loadS(u){S=Object.assign({},DEF,{done:{},hist:[]});try{Object.assign(S,JSON.parse(localStorage.getItem("su_d_"+u)||"{}"))}catch(e){}if(!S.name)S.name=(users()[u]||{}).name||u.split("@")[0]}
const users=()=>{try{return JSON.parse(localStorage.getItem("su_users")||"{}")}catch(e){return{}}};
async function hash(p,salt){const t=salt+":"+p;if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}let x=5381;for(const c of t)x=((x<<5)+x+c.charCodeAt(0))|0;return"f"+x}
async function doAuth(){
 const u=AUTH.u.trim().toLowerCase(),p=AUTH.p,all=users(),up=AUTH.m=="up";
 if(up?!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(u):!u){AUTH.e=up?"Enter a valid email address.":"Enter your email.";draw();return}
 if(p.length<4){AUTH.e="Password must be at least 4 characters.";draw();return}
 AUTH.b=true;AUTH.e="";draw();
 try{
  if(up){
   if(all[u]){AUTH.e="An account with this email already exists.";}
   else if(p!==AUTH.p2){AUTH.e="Passwords don’t match.";}
   else{const salt=Math.random().toString(36).slice(2);all[u]={salt,hash:await hash(p,salt),since:Date.now(),name:AUTH.n.trim()};
    if(!Object.keys(users()).length){const old=localStorage.getItem("su");if(old)localStorage.setItem("su_d_"+u,old)}
    localStorage.setItem("su_users",JSON.stringify(all));AUTH.b=false;login(u);return}
  }else{
   const r=all[u];
   if(!r||await hash(p,r.salt)!==r.hash)AUTH.e="Wrong email or password.";
   else{AUTH.b=false;login(u);return}
  }
 }catch(e){AUTH.e="Couldn’t save the account on this device."}
 AUTH.b=false;draw()}
function login(u,keepOv){const keep=keepOv??AUTH.k;USER=u;loadS(u);AUTH={m:"in",n:"",u:"",p:"",p2:"",e:"",b:false,k:false};try{if(keep)localStorage.setItem("su_sess2",u);else localStorage.removeItem("su_sess2")}catch(e){}view=null;tab="learn";menu=false;draw()}
function logout(){if(rec)return;USER=null;menu=false;try{localStorage.removeItem("su_sess2")}catch(e){}view=null;resetRec();draw()}
function tf(e){if(e.value.indexOf("\n")>-1)e.value=e.value.replace(/\n/g,"")}
function tk(e,x){if(e.key==="Enter"){e.preventDefault();if(!x)doAuth();else e.target.blur()}}
function openMenu(){if(rec)return;menu=true;draw()}
function menuGo(t){menu=false;nav(t)}
function authView(){const up=AUTH.m=="up";
 return `<div class="auth"><div class="mark">${ic("mic",34)}</div><h1 style="text-align:center;margin:0">SpeakUp</h1><p class="mu" style="text-align:center;margin:4px 0 18px">Your AI presentation & public speaking coach</p>
 <div class="card"><div class="row" style="margin-bottom:14px"><button type="button" class="${up?"sec":""}" onclick="AUTH.m='in';AUTH.e='';draw()">Sign in</button><button type="button" class="${up?"":"sec"}" onclick="AUTH.m='up';AUTH.e='';draw()">Create account</button></div>
 <form id="af" autocomplete="off" onsubmit="event.preventDefault();doAuth();return false" novalidate>
 ${up?`<label class="mu" for="an">Your name</label><textarea id="an" class="tf" rows="1" wrap="off" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-form-type="other" oninput="tf(this);AUTH.n=this.value" onkeydown="tk(event)" style="margin:4px 0 10px">${esc(AUTH.n)}</textarea>`:""}
 <label class="mu" for="ae">Email</label><textarea id="ae" class="tf" rows="1" wrap="off" inputmode="email" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-form-type="other" oninput="tf(this);AUTH.u=this.value" onkeydown="tk(event)" style="margin:4px 0 10px">${esc(AUTH.u)}</textarea>
 <label class="mu" for="ap">Password</label><textarea id="ap" class="tf pw" rows="1" wrap="off" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-form-type="other" oninput="tf(this);AUTH.p=this.value" onkeydown="tk(event)" style="margin:4px 0 10px">${esc(AUTH.p)}</textarea>
 ${up?`<label class="mu" for="ap2">Confirm password</label><textarea id="ap2" class="tf pw" rows="1" wrap="off" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-form-type="other" oninput="tf(this);AUTH.p2=this.value" onkeydown="tk(event)" style="margin:4px 0 10px">${esc(AUTH.p2)}</textarea>`:""}
 <label class="mu" style="display:flex;gap:8px;align-items:center;margin:2px 0 12px"><input type="checkbox" ${AUTH.k?"checked":""} onchange="AUTH.k=this.checked" style="width:auto"> Keep me signed in on this device</label>
 ${AUTH.e?`<p style="color:var(--wa);margin:0 0 10px">${esc(AUTH.e)}</p>`:""}
 <button type="submit" style="width:100%" ${AUTH.b?"disabled":""}>${AUTH.b?"Please wait…":up?"Create account":"Sign in"}</button></form></div>
 <p class="mu" style="text-align:center">Accounts are stored on this device only, so each person keeps separate progress. There is no password recovery.</p></div>`}
function drawerHTML(){
 const T=[["learn","learn","Learn"],["practice","practice","Quick practice"],["feedback","feedback","Feedback"],["progress","progress","Progress"],["profile","profile","Profile"]],cu=tab=="practice"?(mode=="quick"?"practice":"learn"):tab;
 return `<div class="dh"><div class="av" ${S.photo?`style="background:url(${S.photo}) center/cover"`:""}>${S.photo?"":esc(((S.name||USER||"?")[0]).toUpperCase())}</div><b style="font-size:18px">${esc(S.name||USER)}</b><div style="opacity:.9;font-size:13px">Level ${lvl()} · ${S.xp} XP · ${S.streak} day streak</div></div>
 ${T.map(x=>`<button class="mi ${cu==x[0]?"on":""}" onclick="menuGo('${x[0]}')">${ic(x[1],20)}${x[2]}</button>`).join("")}
 <div style="flex:1"></div><button class="mi" style="color:var(--wa)" onclick="logout()">${ic("logout",20)}Log out</button>`}
let openLv=null,tab="learn",mode="quick",qstart=false,cur="1a",cam=true,
 st=null,mr=null,chunks=[],rec=false,recog=null,tick=null,gf=null,fid=null,ac=null,an=null,secs=0,t0=0,
 mediaURL="",recBlob=null,isVideo=false,live={rms:[],f0:[]},frames=[],aud=null,TX="",busy=false,err="",note="",view=null;
const $=s=>document.querySelector(s);
const P={learn:'<path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>',
practice:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/>',
feedback:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
progress:'<path d="M22 7 13.5 15.5l-5-5L2 17"/><path d="M16 7h6v6"/>',
profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>',
upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/>',
check:'<path d="m5 12 5 5L20 7"/>',
lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
back:'<path d="M19 12H5M12 19l-7-7 7-7"/>'};
const ic=(n,z=22)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${P[n]}</svg>`;
const RI=r=>`<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">${r?'<rect x="6" y="6" width="12" height="12" rx="2"/>':'<circle cx="12" cy="12" r="8"/>'}</svg>`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const unlocked=i=>i===0||(S.done[ALL[i-1].id]||0)>=ALL[i-1].min;
const lvl=()=>Math.floor(S.xp/100)+1;
function go(t){if(rec)return;tab=t;draw()}
function draw(){
 const A=!!USER;if(document.body)document.body.classList.toggle("in",A);
 $("#bar").style.display=A?"flex":"none";$("#nav").style.display=A?"flex":"none";
 if(!A){$("#fab").style.display="none";$("#drawer").classList.remove("open");$("#scrim").style.display="none";$("#app").innerHTML=authView();return}
 const T=[["learn","learn","Learn"],["feedback","feedback","Feedback"],["progress","progress","Progress"],["profile","profile","Profile"]];
 $("#nav").innerHTML=T.map(x=>`<button class="${(tab=="practice"?(mode=="lesson"?"learn":""):tab)==x[0]?"on":""}" onclick="nav('${x[0]}')">${ic(x[1],22)}<span>${x[2]}</span></button>`).join("");
 $("#app").innerHTML=({learn,practice,feedback,progress,profile})[tab]();$("#fab").style.display=tab=="practice"?"none":"flex";
 $("#drawer").innerHTML=drawerHTML();$("#drawer").classList.toggle("open",menu);$("#scrim").style.display=menu?"block":"none";
 const pv=$("#pv");if(pv&&st){pv.srcObject=st;pv.play().catch(()=>{})}
}
/* ---------- Learn ---------- */
function learn(){
 const pass=x=>(S.done[x.id]||0)>=x.min;
 if(openLv==null){
  let h=`<h1>Learn</h1><div class="mu" style="margin-bottom:10px">Pick a level. Reach each target score to unlock the next task.</div>`;
  LV.forEach((l,li)=>{const n=l.ls.length,p=l.ls.filter(pass).length,lock=!unlocked(ALL.findIndex(a=>a.id==l.ls[0].id));
   h+=`<div class="card" style="${lock?"opacity:.5":"cursor:pointer"}" ${lock?"":`onclick="openLv=${li};draw()"`}><div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:10px"><b style="color:${l.c};flex:1;min-width:0">${l.n}</b><span class="mu" style="flex:none;display:flex;gap:6px;align-items:center">${lock?ic("lock",16):""}${p}/${n} done</span></div><div class="bar"><i style="width:${100*p/n}%;background:${l.c}"></i></div><div class="mu">${lock?"Finish the previous level to unlock":p==n?"Completed ✓":"Tap to open"}</div></div>`});
  return h}
 const l=LV[openLv];
 let h=`<button class="sec ico" onclick="openLv=null;draw()">${ic("back",18)}All levels</button><h2 style="color:${l.c}">${l.n}</h2>`;
 l.ls.forEach((x,j)=>{const i=ALL.findIndex(a=>a.id==x.id),u=unlocked(i),d=pass(x),b=S.done[x.id];
  h+=`<div class="lesson ${u?"":"lock"}" ${u?`onclick="pick('${x.id}')"`:""}><div class="dot ${d?"done":u?"":"lock"}">${d?ic("check",22):u?j+1:ic("lock",19)}</div><div><b>${x.t}</b><div class="mu">Target ${x.min}+${b!=null?" · best "+b:""}</div></div></div>`});
 return h}
function pick(id){cur=id;mode="lesson";resetRec();go("practice")}
/* ---------- Practice ---------- */
function resetRec(){if(mediaURL)URL.revokeObjectURL(mediaURL);mediaURL="";recBlob=null;TX="";frames=[];live={rms:[],f0:[]};aud=null;secs=0;note="";err="";isVideo=false}

const rmsOf=b=>{let s=0;for(let i=0;i<b.length;i++)s+=b[i]*b[i];return Math.sqrt(s/b.length)};

 for(let l=lo;l<=hi;l++){let s=0,a=0,c=0;for(let i=0;i<n-l;i++){s+=x[i]*x[i+l];a+=x[i]*x[i];c+=x[i+l]*x[i+l]}const r=s/Math.sqrt(a*c+1e-9);if(r>best){best=r;bl=l}}

function summ(rms,f0){
 if(rms.length<30)return null;

 let long=0,run=0;seg.forEach(x=>{if(x<thr)run++;else{if(run>=10)long++;run=0}});
 const db=v.map(x=>20*Math.log10(x)),m=db.reduce((s,x)=>s+x,0)/db.length,sd=Math.sqrt(db.reduce((s,x)=>s+(x-m)**2,0)/db.length);

 const ps=p.length>=15?Math.sqrt(p.map(x=>12*Math.log2(x/pm)).reduce((s,x)=>s+x*x,0)/p.length):null;
 return{span:Math.round(seg.length/10),speak:Math.round(v.length/10),silentPct:Math.round(100*(1-v.length/seg.length)),long,volSd:+sd.toFixed(1),pitch:ps==null?0:Math.round(pm),pitchSd:ps==null?null:+ps.toFixed(1)}}

 <div class="card"><b>Score trend</b>${h.length?`<svg viewBox="0 0 300 110" style="width:100%;margin-top:8px"><polyline fill="none" stroke="var(--pr)" stroke-width="3" points="${pts}"/>${h.map((x,i)=>`<circle cx="${X(i)}" cy="${100-x.score}" r="4" fill="var(--pr)"/>`).join("")}</svg>`:`<p class="mu">Your chart appears after your first evaluation.</p>`}</div>
 <div class="card"><b>Badges</b><p>${[["","First speech",S.hist.length>=1],["","3-day streak",S.streak>=3],["","Score 90+",S.hist.some(x=>x.score>=90)],["","Video speech",S.hist.some(x=>x.vid)],["","Level 1 done",L1]].map(b=>`<span class="chip" style="opacity:${b[2]?1:.35}">${b[1]}</span>`).join("")}</p></div>
 <div class="card"><b>History</b>${S.hist.slice().reverse().slice(0,10).map(x=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span>${esc(x.lesson)}</span><b style="flex:none">${x.score}</b></div>`).join("")||`<p class="mu">Nothing yet.</p>`}</div>`}
function setPhoto(i){const f=i.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=160;c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.photo=c.toDataURL("image/jpeg",.8);save();URL.revokeObjectURL(u);draw()};im.src=u}
function resetProg(){if(!confirm("Reset all progress?"))return;const k={name:S.name,photo:S.photo,goal:S.goal,ai:S.ai};S=Object.assign({},DEF,{done:{},hist:[]},k);save();view=null;go("learn")}
function delAcc(){if(!confirm("Delete this account and all its progress from this device?"))return;const all=users();delete all[USER];try{localStorage.setItem("su_users",JSON.stringify(all));localStorage.removeItem("su_d_"+USER)}catch(e){}logout()}
function profile(){
 const u=users()[USER]||{},since=u.since?new Date(u.since).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"–",
 passed=Object.keys(S.done).filter(k=>S.done[k]>=ALL.find(a=>a.id==k).min).length,best=S.hist.length?Math.max(...S.hist.map(x=>x.score)):"–";
 return `<h1>My profile</h1>
 <div class="card" style="text-align:center"><div class="av" style="width:96px;height:96px;font-size:40px;margin:0 auto 10px;background:${S.photo?`url(${S.photo}) center/cover`:"var(--g)"};color:#fff" onclick="$('#ph').click()">${S.photo?"":esc(((S.name||USER)[0]||"?").toUpperCase())}</div>
 <input type="file" id="ph" accept="image/*" hidden onchange="setPhoto(this)"><button class="sec" onclick="$('#ph').click()" style="padding:6px 14px;font-size:14px">Change photo</button>
 <div style="margin-top:10px;font-weight:700">${esc(S.name)}</div><div class="mu">${esc(USER)}</div><div class="mu">Member since ${since}</div></div>
 <div class="row"><div class="card stat"><b>${lvl()}</b><span class="mu">level</span></div><div class="card stat"><b>${S.xp}</b><span class="mu">XP</span></div><div class="card stat"><b>${S.streak}</b><span class="mu">day streak</span></div></div>
 <div class="row"><div class="card stat"><b>${passed}/${ALL.length}</b><span class="mu">tasks passed</span></div><div class="card stat"><b>${S.hist.length}</b><span class="mu">lessons done</span></div><div class="card stat"><b>${best}</b><span class="mu">best score</span></div></div>
 <div class="card"><div class="mu">Display name</div><textarea class="tf" rows="1" wrap="off" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-form-type="other" oninput="tf(this);S.name=this.value;save()" onkeydown="tk(event,1)">${esc(S.name)}</textarea>
 <div class="mu" style="margin-top:10px">Main goal</div><select onchange="S.goal=this.value;save()">${["","Confidence","Less filler words","Pitching","Storytelling","Job interviews"].map(g=>`<option value="${g}" ${S.goal==g?"selected":""}>${g||"Not set"}</option>`).join("")}</select>
 <div class="mu" style="margin-top:10px">Feedback language</div><select onchange="S.ai=this.value;save()"><option value="en" ${S.ai=="en"?"selected":""}>English</option><option value="si" ${S.ai=="si"?"selected":""}>සිංහල (Sinhala)</option></select></div>
 <div class="card"><b>Tips</b><p class="mu">Face a window, keep your head and hands in frame, and look at the camera lens. Progress is saved on this device.</p></div>
 <button class="sec ico" style="width:100%;margin-bottom:8px" onclick="logout()">${ic("logout",18)}Log out</button>
 <button class="sec" style="width:100%;margin-bottom:8px" onclick="resetProg()">Reset progress</button>
 <button class="sec" style="width:100%;color:var(--wa);border-color:var(--wa)" onclick="delAcc()">Delete account</button>`}

const sess=(()=>{try{return localStorage.getItem("su_sess2")}catch(e){return null}})();
if(sess&&users()[sess])login(sess,true);else draw();
</script></body></html>
